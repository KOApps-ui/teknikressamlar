<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="KO|Apps - Teknik Ressamlar & İşveren Merkeziyetsiz Ağı">
  <meta name="theme-color" content="#001220">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KO|Apps">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KO|Apps - Teknik Ressamlar & İşveren</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #001220;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #00223a 0%, #001220 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    #loading-logo {
      width: 128px;
      height: 128px;
      border-radius: 26px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.4), 0 10px 25px rgba(0, 0, 0, 0.6);
      animation: pulse 2.2s infinite ease-in-out;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    #loading-title {
      color: #ffffff;
      margin-top: 24px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    #loading-subtitle {
      color: #4cc9f0;
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }
    .spinner {
      margin-top: 28px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top: 3px solid #00e5ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.97); box-shadow: 0 0 25px rgba(0, 229, 255, 0.25); }
      50% { transform: scale(1.03); box-shadow: 0 0 50px rgba(0, 229, 255, 0.6); }
      100% { transform: scale(0.97); box-shadow: 0 0 25px rgba(0, 229, 255, 0.25); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img id="loading-logo" src="app_logo.png" alt="KO|Apps Logo">
    <div id="loading-title">KO|Apps - Teknik Ressamlar</div>
    <div id="loading-subtitle">Merkeziyetsiz Çizim & İşveren Ekosistemi Yükleniyor...</div>
    <div class="spinner"></div>
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading-container');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 450);
      }
    }

    window.addEventListener('flutter-first-frame', removeLoader);

    // Fallback observer when Flutter DOM attaches
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        setTimeout(removeLoader, 300);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout: remove after 10s max if event was missed
    setTimeout(removeLoader, 10000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
