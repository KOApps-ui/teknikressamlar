name: Otomatik APK & iOS IPA Yayınlama (CI/CD)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Android APK Derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: APK İsimlendir
        run: cp build/app/outputs/flutter-apk/app-release.apk KO_Apps_TeknikRessam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: KO_Apps_TeknikRessam.apk

  build-ios:
    name: 🍏 iOS IPA Derleme (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: IPA Paketini Oluştur
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r KO_Apps_TeknikRessam.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: KO_Apps_TeknikRessam.ipa

  publish-release:
    name: 🚀 GitHub Release Oluştur
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: iOS-IPA
          path: release-assets
      - name: GitHub Release Yayınla
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/KO_Apps_TeknikRessam.apk
            release-assets/KO_Apps_TeknikRessam.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
